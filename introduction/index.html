<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="author" content="Arnaud Dyèvre">
  <meta name="description" content="Introduction au cours de macroéconomie, HEC Paris, Licence 3, automne 2026. Diapositives du cours.">
  <title>Macroéconomie · Session 0 · HEC Paris L3 2026</title>
  <link rel="stylesheet" href="session0.css">
  <link rel="stylesheet" href="../exercices.css">
</head>
<body>
  <main id="viewport"><div id="stage" aria-label="Diapositives de la session d’introduction"></div></main>
  <nav id="toolbar" aria-label="Navigation des diapositives">
    <button id="previous" aria-label="Diapositive précédente">←</button><span id="counter" aria-live="polite"></span><button id="next" aria-label="Diapositive suivante">→</button><span class="sep"></span>
    <button id="toc-button">Sommaire <small>(S)</small></button><button id="reading-button">Lecture <small>(L)</small></button><span class="sep"></span><span class="shortcuts">← → naviguer · F plein écran</span>
  </nav>
  <div id="contents" class="overlay" role="dialog" aria-modal="true" aria-labelledby="contents-title"><div class="panel"><button class="close" aria-label="Fermer le sommaire">×</button><h2 id="contents-title">Session 0 · Introduction</h2><ol></ol></div></div>
  <script src="session0.js"></script>
  <script>
  (() => {
    const stage = document.getElementById('stage');
    const toc = document.querySelector('#contents ol');
    const overlays = [...document.querySelectorAll('.overlay')];
    let totalPages = 0;
    const pageNumbers = INTRO_SLIDES.map(s => s.kind === 'cover' || s.appendix ? null : ++totalPages);
    const pageLabel = index => pageNumbers[index] === null
      ? (INTRO_SLIDES[index].appendix ? 'Annexe' : 'Couverture')
      : `${pageNumbers[index]} / ${totalPages}`;
    let current = 0;
    INTRO_SLIDES.forEach((s, i) => {
      const section = document.createElement('section'); section.id = s.id; section.className = `slide ${s.kind || ''} ${s.exercise ? 'exercise' : ''}`;
      section.setAttribute('aria-label', pageNumbers[i] === null ? s.title : `Page ${pageNumbers[i]}. ${s.title}`);
      section.innerHTML = `${s.kind ? '' : `<header class="slide-head"><h1>${s.title}</h1></header>`}<div class="slide-body">${s.html}</div><footer class="slide-foot"><div class="source">${s.source || ''}</div></footer><span class="slide-page-number">${pageNumbers[i] === null ? '' : pageLabel(i)}</span>`;
      stage.append(section);
      const li = document.createElement('li'); const a = document.createElement('a'); a.href = '#' + s.id; a.textContent = pageNumbers[i] === null ? s.title : `${pageNumbers[i]}. ${s.title}`; a.addEventListener('click', () => closeOverlays()); li.append(a); toc.append(li);
    });
    const sections = [...document.querySelectorAll('.slide')];
    function resize() { document.documentElement.style.setProperty('--scale', Math.min(innerWidth / 1600, (innerHeight - 48) / 900)); }
    function closeOverlays() { overlays.forEach(el => el.classList.remove('open')); }
    function display(index, updateHash = true) {
      current = Math.max(0, Math.min(index, INTRO_SLIDES.length - 1));
      sections.forEach((el, i) => {el.classList.toggle('active', i === current);el.setAttribute('aria-hidden', String(!document.body.classList.contains('reading') && i !== current));});
      document.getElementById('counter').textContent = pageLabel(current);
      document.getElementById('previous').disabled = current === 0; document.getElementById('next').disabled = current === INTRO_SLIDES.length - 1;
      const s = INTRO_SLIDES[current];
      if (updateHash) history.replaceState(null, '', '#' + s.id);
      if (document.body.classList.contains('reading')) sections[current].scrollIntoView({behavior:'instant',block:'start'});
    }
    function toggleOverlay(id) { const target = document.getElementById(id); const wasOpen = target.classList.contains('open'); closeOverlays(); if (!wasOpen) {target.classList.add('open');target.querySelector('button').focus();} }
    function toggleReading() {document.body.classList.toggle('reading'); document.getElementById('reading-button').innerHTML = document.body.classList.contains('reading') ? 'Projection <small>(L)</small>' : 'Lecture <small>(L)</small>'; display(current, false);resize();}
    document.getElementById('previous').onclick = () => display(current - 1); document.getElementById('next').onclick = () => display(current + 1);
    document.getElementById('toc-button').onclick = () => toggleOverlay('contents'); document.getElementById('reading-button').onclick = toggleReading;
    overlays.forEach(el => {el.querySelector('.close').onclick = closeOverlays;el.addEventListener('click',e => {if(e.target === el) closeOverlays();});});
    document.addEventListener('keydown', e => {
      if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
      if (e.key === 'Escape') {closeOverlays();return;}
      if (overlays.some(el => el.classList.contains('open'))) return;
      if (['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)) {e.preventDefault();display(current+1);}
      else if (['ArrowLeft','ArrowUp','PageUp'].includes(e.key)) {e.preventDefault();display(current-1);}
      else if(e.key === 'Home') {e.preventDefault();display(0);}
      else if(e.key === 'End') {e.preventDefault();display(INTRO_SLIDES.length-1);}
      else if(e.key.toLowerCase() === 's') toggleOverlay('contents');
      else if(e.key.toLowerCase() === 'l') toggleReading();
      else if(e.key.toLowerCase() === 'f') {if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();}
    });
    function fromHash(){const i=INTRO_SLIDES.findIndex(s=>s.id === decodeURIComponent(location.hash.slice(1)));display(i<0?0:i,false);}
    addEventListener('resize',resize); addEventListener('hashchange',fromHash);resize();fromHash();
  })();
  </script>
</body>
</html>
